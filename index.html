<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CotejaFácil - Copiloto Virtual IVAO/VATSIM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- COLUNA 1: Navegação (Esquerda) -->
        <aside class="sidebar">
            <div class="logo">
                <h2>✈️ CotejaFácil</h2>
                <p>Virtual First Officer</p>
            </div>
            <nav id="nav-tabs">
                <button class="tab-btn active" data-tab="1">1. Autorização</button>
                <button class="tab-btn" data-tab="2">2. Acionamento e Táxi</button>
                <button class="tab-btn" data-tab="3">3. Decolagem</button>
                <button class="tab-btn" data-tab="4">4. Subida e Cruzeiro</button>
                <button class="tab-btn" data-tab="5">5. Aproximação e Pouso</button>
            </nav>
        </aside>

        <!-- COLUNA 2: Centro (Checklist, Forms e Fraseologia) -->
        <main class="main-content">
            <header class="progress-header">
                <h3>Progresso do Checklist: <span id="progress-text">0%</span></h3>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </header>

            <section class="checklist-section">
                <h3>Checklist da Fase</h3>
                <div id="checklist-container" class="checklist-container">
                    <!-- Checklists gerados via JS -->
                </div>
            </section>

            <section class="inputs-section">
                <h3>Dados Operacionais da Fase</h3>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="input-atis">Informação ATIS</label>
                        <input type="text" id="input-atis" placeholder="Ex: A, B, C...">
                    </div>
                    <div class="input-group">
                        <label for="input-gate">Portão / Gate</label>
                        <input type="text" id="input-gate" placeholder="Ex: 12, G3...">
                    </div>
                    <div class="input-group">
                        <label for="input-runway">Pista em Uso</label>
                        <input type="text" id="input-runway" placeholder="Ex: 09L, 27...">
                    </div>
                    <div class="input-group">
                        <label for="input-sid">Saída SID</label>
                        <input type="text" id="input-sid" placeholder="Ex: UMBAL 1A">
                    </div>
                    <div class="input-group">
                        <label for="input-transition">Transição</label>
                        <input type="text" id="input-transition" placeholder="Ex: N/A ou ISVIG">
                    </div>
                    <div class="input-group">
                        <label for="input-alt">Altitude Inicial</label>
                        <input type="text" id="input-alt" placeholder="Ex: FL070, 5000ft">
                    </div>
                    <div class="input-group">
                        <label for="input-taxi">Rota de Táxi</label>
                        <input type="text" id="input-taxi" placeholder="Ex: Alfa, Bravo, Pátio 1">
                    </div>
                </div>
            </section>

            <section class="phraseology-section">
                <div class="phrase-box">
                    <div class="phrase-box-header">
                        <h4>📡 Piloto Fala</h4>
                        <button class="copy-btn" onclick="copyText('pilot-speaks')">📋 Copiar</button>
                    </div>
                    <textarea id="pilot-speaks" readonly></textarea>
                </div>
                <div class="phrase-box">
                    <div class="phrase-box-header">
                        <h4>🎧 Cotejamento (Readback)</h4>
                        <button class="copy-btn" onclick="copyText('pilot-readback')">📋 Copiar</button>
                    </div>
                    <textarea id="pilot-readback" readonly></textarea>
                </div>
            </section>
        </main>

        <!-- BARRA DE REDIMENSIONAMENTO -->
        <div class="resizer" id="resizer"></div>

        <!-- COLUNA 3: Painel Informativo (Direita) -->
        <aside class="info-panel">
            <div class="simbrief-data">
                <h3>Dados do Voo (SimBrief)</h3>
                <div class="input-group">
                    <label>ID de Piloto ou Username</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="simbrief-username" placeholder="Ex: 123456" style="flex-grow: 1;">
                        <button type="button" class="copy-btn" onclick="importSimBrief()" style="background-color: var(--accent-green); color: var(--bg-dark);">📥 Puxar</button>
                    </div>
                </div>
                <div class="input-group" style="margin-top: 10px;">
                    <label>Callsign</label>
                    <input type="text" id="info-callsign" value="GLO1932">
                </div>
                <div class="input-group">
                    <label>Origem (ICAO)</label>
                    <input type="text" id="info-origin" value="SBGR">
                </div>
                <div class="input-group">
                    <label>Destino (ICAO)</label>
                    <input type="text" id="info-dest" value="SBPA">
                </div>
                <div class="input-group">
                    <label>Nível de Cruzeiro</label>
                    <input type="text" id="info-cruise" value="FL360">
                </div>
                <div class="input-group">
                    <label>Transponder (Squawk)</label>
                    <input type="text" id="info-squawk" value="1000">
                </div>
            </div>

            <div class="frequencies-data">
                <h3>Frequências de Rádio</h3>
                <ul class="freq-list" id="freq-list-content">
                    <!-- Gerado via JavaScript dinamicamente -->
                </ul>
            </div>

            <div class="converter-data" style="margin-top: 10px;">
                <h3>Conversor Rápido</h3>
                
                <div class="converter-grid">
                    <div class="input-group">
                        <label>Altímetro (inHg)</label>
                        <input type="number" id="conv-inhg" placeholder="29.92" step="0.01">
                    </div>
                    <div class="input-group">
                        <label>QNH (hPa)</label>
                        <input type="number" id="conv-hpa" placeholder="1013">
                    </div>
                </div>

                <div class="converter-grid" style="margin-top: 15px;">
                    <div class="input-group">
                        <label>Peso (Libras)</label>
                        <input type="number" id="conv-lbs" placeholder="10000">
                    </div>
                    <div class="input-group">
                        <label>Peso (Quilos)</label>
                        <input type="number" id="conv-kg" placeholder="4535">
                    </div>
                </div>
            </div>
            
        </aside>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
